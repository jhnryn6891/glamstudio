[project]
name = "ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crewai>=1.15.41",
    "fastapi>=0.163.0",
    "groq>=0.37.1",
    "httpx>=0.28.1",
    "langchain-groq>=1.1.3",
    "litellm>=1.108.7",
    "pydantic>=2.12.5",
    "sqlmodel>=0.0.50",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-agent = "ai_agent:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
